version: field_registry.v1
schema_version: 1
description: Versioned CSV/manual import field registry for Prompt 4 collection workflows.
fields:
  - key: organization_display_name
    label: Organization Display Name
    aliases: [company, company_name, organization, organization_name, firm_name]
    destination: organization.display_name
    type: string
    required: true
    normalization_rule: trim_whitespace
    validation_rule: non_empty_string
    blank_behavior: reject_if_required
    sensitivity: internal
    evidence_behavior: create_import_evidence
    duplicate_relevance: high
    help: Primary organization name shown to users.
    version: field_registry.v1
  - key: organization_legal_name
    label: Organization Legal Name
    aliases: [legal_name, registered_name]
    destination: organization.legal_name
    type: string
    required: false
    normalization_rule: trim_whitespace
    validation_rule: string
    blank_behavior: leave_blank
    sensitivity: internal
    evidence_behavior: create_import_evidence
    duplicate_relevance: medium
    help: Legal or registered organization name when supplied.
    version: field_registry.v1
  - key: organization_domain
    label: Organization Domain
    aliases: [domain, website_domain, website, url]
    destination: organization.domain
    type: domain
    required: false
    normalization_rule: normalize_domain
    validation_rule: valid_domain_or_url
    blank_behavior: leave_blank
    sensitivity: internal
    evidence_behavior: create_import_evidence
    duplicate_relevance: high
    help: Website domain used for duplicate matching and organization identity.
    version: field_registry.v1
