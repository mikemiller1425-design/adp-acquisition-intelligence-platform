          variable_key: client_decision_influence,
          weight: 0.30,
          transform: ordinal_linear,
          required: true,
          transform_config: { min: 0, max: 4 },
        }
      - {
          key: interaction_frequency,
          variable_key: interaction_frequency,
          weight: 0.20,
          transform: ordinal_linear,
          transform_config: { min: 0, max: 4 },
        }
      - {
          key: trust,
          variable_key: trust_level,
          weight: 0.20,
          transform: ordinal_linear,
          transform_config: { min: 0, max: 4 },
        }
      - {
          key: recommendation_authority,
          variable_key: recommendation_authority,
          weight: 0.20,
          transform: boolean_flag,
        }
      - {
          key: executive_access,
          variable_key: executive_access,
          weight: 0.10,
          transform: boolean_flag,
        }
  - key: urgency
    display_name: Urgency
    description: Approved Phase 1 baseline urgency support score; urgency does not mean fit.
    family: support
    subject_type: organization
    version: 1.0.0
    status: active
    approval_status: approved
    activation_allowed: true
    minimum_completeness: 0.40
    range: [0, 100]
    tiers: { high: 75, medium: 50, low: 0 }
    confidence_policy: { approval_status: approved, base: evidence_average }
    recommendation_policy: { strategic_priority: 6, next_action: Verify time-sensitive trigger. }
    components:
      - {
          key: dated_trigger,
          variable_key: dated_trigger,
          weight: 0.35,
          transform: trigger_recency,
          required: true,
          transform_config: { fresh_days: 14, stale_days: 120 },
        }
      - {
          key: contract_timing,
          variable_key: contract_renewal_timing,
          weight: 0.25,
          transform: trigger_recency,
          transform_config: { fresh_days: 30, stale_days: 365 },
        }
      - {
          key: pain_severity,
          variable_key: provider_pain,
          weight: 0.25,
          transform: ordinal_linear,
          transform_config: { min: 0, max: 4 },
        }
      - {
          key: leadership_growth_event,
          variable_key: leadership_growth_event,
          weight: 0.15,
          transform: boolean_flag,
        }
  - key: revenue_potential
    display_name: Revenue Potential
    description: Approved Phase 1 baseline revenue potential support score; revenue is not qualification.
    family: support
    subject_type: organization
    version: 1.0.0
    status: active
    approval_status: approved
    activation_allowed: true
    minimum_completeness: 0.45
    range: [0, 100]
    tiers: { high: 75, medium: 50, low: 0 }
    confidence_policy: { approval_status: approved, base: evidence_average }
    recommendation_policy:
      { strategic_priority: 7, next_action: Validate volume and economics bands. }
    components:
      - {
          key: payroll_volume,
          variable_key: payroll_client_count,
          weight: 0.35,
          transform: range_midpoint_band,
          required: true,
          transform_config:
            {
              bands:
                [{ max: 24, score: 20 }, { min: 25, max: 99, score: 55 }, { min: 100, score: 90 }],
            },
        }
      - {
          key: typical_size,
          variable_key: typical_client_employee_count,
          weight: 0.25,
          transform: range_midpoint_band,
          transform_config:
            {
              bands:
                [{ max: 24, score: 30 }, { min: 25, max: 250, score: 85 }, { min: 251, score: 65 }],
            },
        }
      - {
          key: motion_economics,
          variable_key: estimated_revenue,
          weight: 0.25,
          transform: currency_band,
          transform_config:
            {
              bands:
                [
                  { max_minor: 49999999, score: 30 },
                  { min_minor: 50000000, max_minor: 199999999, score: 60 },
                  { min_minor: 200000000, score: 85 },
                ],
            },
        }
      - {
          key: range_confidence,
          variable_key: range_confidence,
          weight: 0.15,
          transform: percentage_linear,
        }
  - key: accessibility
    display_name: Accessibility
    description: Approved Phase 1 baseline lawful and practical reachability support score.
    family: support
    subject_type: organization
    version: 1.0.0
    status: active
    approval_status: approved
    activation_allowed: true
    minimum_completeness: 0.45
    range: [0, 100]
    tiers: { high: 75, medium: 50, low: 0 }
    confidence_policy: { approval_status: approved, base: evidence_average }
    recommendation_policy:
      { strategic_priority: 8, next_action: Confirm reachable authorized contact path. }
    components:
      - {
          key: verified_contact,
          variable_key: verified_contact,
          weight: 0.30,
          transform: boolean_flag,
          required: true,
        }
      - { key: decision_role, variable_key: decision_role, weight: 0.25, transform: boolean_flag }
      - {
          key: relationship_access,
          variable_key: relationship_access,
          weight: 0.25,
          transform: ordinal_linear,
          transform_config: { min: 0, max: 4 },
        }
      - {
          key: channel_permission,
          variable_key: channel_permission,
          weight: 0.20,
          transform: boolean_flag,
          required: true,
