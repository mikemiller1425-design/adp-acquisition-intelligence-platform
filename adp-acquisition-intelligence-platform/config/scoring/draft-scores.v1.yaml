  - key: data_confidence
    display_name: Data Confidence
    description: Approved Phase 1 baseline reliability support score.
    family: support
    subject_type: organization
    version: 1.0.0
    status: active
    approval_status: approved
    activation_allowed: true
    minimum_completeness: 0.40
    range: [0, 100]
    tiers: { high: 75, medium: 50, low: 0 }
    confidence_policy: { approval_status: approved, base: evidence_average }
    recommendation_policy:
      { strategic_priority: 9, next_action: Improve evidence quality, recency, and agreement. }
    components:
      - {
          key: evidence_quality,
          variable_key: evidence_quality,
          weight: 0.35,
          transform: percentage_linear,
          required: true,
        }
      - {
          key: agreement,
          variable_key: cross_source_agreement,
          weight: 0.25,
          transform: percentage_linear,
        }
      - { key: recency, variable_key: evidence_recency, weight: 0.25, transform: percentage_linear }
      - {
          key: verification,
          variable_key: verification_level,
          weight: 0.15,
          transform: ordinal_linear,
          transform_config: { min: 0, max: 4 },
        }
