    weight: 0.20
    range: [0, 1]
  - key: specificity
    required: true
    weight: 0.20
    range: [0, 1]
  - key: recency
    required: true
    weight: 0.20
    range: [0, 1]
  - key: crossSourceAgreement
    required: true
    weight: 0.20
    range: [0, 1]
  - key: extractionCertainty
    required: true
    weight: 0.20
    range: [0, 1]
aggregation:
  formula_status: draft
  required_missing_behavior:
    aggregate_score: null
    aggregate_status: unassessed
  base_formula: equal_weight_mean_of_present_required_components
