key: recommendation_policy
version: 1.0.0
status: active
approval_status: approved
activation_allowed: true
primary_motion_selection:
  basis: strongest_confidence_adjusted_eligible_motion
  minimum_completeness_required: true
  disqualifiers_block_recommendation_not_fit_score: true
secondary_motion:
  proximity_threshold: 0.10
  proximity_threshold_points_on_0_100: 10
  approval_status: approved
tie_break_sequence:
  - final_over_provisional
  - higher_confidence
  - higher_completeness
  - reviewer_configured_strategic_priority
  - no_recommendation_human_review
urgency_rules:
  affects: ordering_and_next_action
  does_not_affect: fit_qualification
revenue_rules:
  affects: priority
  does_not_affect: qualification
policy_blocks:
  - existing_relationship
  - territory
  - consent_or_suppression
  - reputational_or_policy_flag
precision_rule: never_fabricate_precision
activation_evidence:
  approval_status: approved
  approved_at: '2026-07-22T00:00:00Z'
  approved_by: repository owner (mikemiller1425-design) via Prompt 6 unblock instruction 2026-07-22
  scope: Phase 1 baseline approval of the draft mappings/weights already published
  notes:
    - SCR-002 Phase 1 baseline approved for Prompt 6 entry
    - CONF-007 resolved in docs/00-readiness/SPECIFICATION_CONFLICT_REGISTER.md
