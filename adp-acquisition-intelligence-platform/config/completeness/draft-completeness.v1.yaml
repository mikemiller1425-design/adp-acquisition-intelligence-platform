      - { key: operational_burden, weight: 0.10, required: false }
      - { key: technology_maturity, weight: 0.08, required: false }
      - { key: client_decision_influence, weight: 0.10, required: false }
      - { key: verified_contact, weight: 0.10, required: true }
      - { key: channel_permission, weight: 0.10, required: true }
