name: CI

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: adp-acquisition-intelligence-platform/pnpm-lock.yaml
      - name: Install
        working-directory: adp-acquisition-intelligence-platform
        run: pnpm install --frozen-lockfile
      - name: Validate
        working-directory: adp-acquisition-intelligence-platform
        run: pnpm validate
